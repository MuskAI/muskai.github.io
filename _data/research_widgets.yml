papers:
  - title: "Multimodal Language Models See Better When They Look Shallower"
    venue: "EMNLP 2025 Main, Oral"
    image: "/assets/img/publication_preview/emnlp-2025-visual-layers.png"
    question: "Which visual encoder layer should a multimodal language model actually use?"
    finding: "Later is not always better. Shallower visual layers can preserve information that deeper layers discard."
    url: "https://aclanthology.org/2025.emnlp-main.339/"
    project_url: "/projects/visual-layer-selection/"
  - title: "Multi-Layer Visual Feature Fusion in Multimodal LLMs"
    venue: "CVPR 2025"
    image: "/assets/img/publication_preview/cvpr-2025-fusion-paradigms.png"
    question: "How should complementary visual features from different layers be combined?"
    finding: "Fusion works best when its location and mechanism match the information each visual layer contributes."
    url: "https://openaccess.thecvf.com/content/CVPR2025/html/Lin_Multi-Layer_Visual_Feature_Fusion_in_Multimodal_LLMs_Methods_Analysis_and_CVPR_2025_paper.html"
    project_url: "/projects/multi-layer-feature-fusion/"
  - title: "To Preserve or To Compress"
    venue: "EMNLP 2024"
    image: "/assets/img/publication_preview/emnlp-2024-connector-structures.png"
    question: "Should the connector preserve visual tokens or compress them before they reach the language model?"
    finding: "Connector structure is an information bottleneck, not a minor implementation detail."
    url: "https://arxiv.org/abs/2410.06765"
    project_url: "/projects/connector-selection/"

questions:
  - id: shallower
    label: "Why can shallower visual layers work better?"
    answer: "Deeper visual layers become increasingly specialized for the encoder's original training objective. Shallower layers can retain spatial detail and local evidence that a language model still needs for multimodal reasoning."
    link_label: "Read the EMNLP 2025 paper"
    link: "https://aclanthology.org/2025.emnlp-main.339/"
  - id: fusion
    label: "What makes multi-layer fusion effective?"
    answer: "The useful question is not only which layers to combine, but where and how to combine them. Different fusion positions preserve different information paths and create different efficiency tradeoffs."
    link_label: "Explore the fusion project"
    link: "/projects/multi-layer-feature-fusion/"
  - id: connector
    label: "Why does connector design matter?"
    answer: "The connector decides how visual tokens are transformed before reaching the language model. Preserving or compressing those tokens changes both the information available to the model and the computational cost."
    link_label: "Explore connector selection"
    link: "/projects/connector-selection/"
  - id: detection
    label: "How should we think about AI-content detection?"
    answer: "A useful detector should support a decision with multiple pieces of evidence. A single confidence score is rarely enough, especially when content has been resized, edited, or recompressed."
    link_label: "Visit the AIGC project"
    link: "/projects/huijian-ai/"

